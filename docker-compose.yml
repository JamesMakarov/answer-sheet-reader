services:
  web:
    build: .
    restart: always
    command: python3 leitor_projeto/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME:-leitor_projeto}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-leitor_db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-development-only}
    depends_on:
      - leitor_db

  leitor_db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_NAME:-leitor_projeto}

volumes:
  postgres_data:
